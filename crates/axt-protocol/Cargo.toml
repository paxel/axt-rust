[package]
name = "axt-protocol"
description = "The Rust library of AXT (Avro eXchange Transfer), the open standard for small apps to exchange typed records. Conforms to AXT 0.2.0."
readme = "../../README.md"
keywords = ["avro", "sync", "interoperability"]
categories = ["encoding", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The answers of the conformance adapter (AXT spec/conformance.md, section 6). Only the
# crate axt-conformance-adapter turns it on; it is not part of the public API.
conformance = ["dep:miniz_oxide", "dep:sha2", "dep:jiff"]

[dependencies]
apache-avro = "0.23.0"
serde_json = "1.0.154"
regex = "1.13.2"
# Only for the conformance adapter: the deflated form of bytes in a vector
# (spec/conformance.md, section 3.2).
miniz_oxide = { version = "0.9.1", optional = true }
sha2 = { version = "0.11.1", optional = true }
# Only for the conformance adapter: the zone rules of the IANA time zone database, bundled
# into the binary so that every platform reads the same rules (spec/time.md, section 6).
jiff = { version = "1.0.2", default-features = false, features = ["std", "tzdb-bundle-always"], optional = true }

[lints]
workspace = true
