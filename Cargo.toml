[workspace]
resolver = "3"
members = ["crates/axt-protocol", "crates/axt-protocol-generate", "crates/axt-conformance-adapter"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/paxel/axt-rust"
authors = ["Patrick Zimmer"]

# The lint set of paxel/gates (configs/rust/lints.toml).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
