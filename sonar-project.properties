# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_axt-rust
# Analysed by .github/workflows/ci.yml (sonar.yml) on every pull request and on summer; Automatic Analysis is off.
sonar.organization=paxel
sonar.projectKey=paxel_axt-rust
sonar.projectName=axt-rust

# The scanner's analysis scope takes the whole project; sonar.sources and sonar.tests have no
# effect there. The tests, the generator's and the adapter's mains and the fuzz target are no
# library code, so they stay out of the coverage, as they do in the coverage ratchet of gates.
sonar.coverage.exclusions=crates/*/tests/**,crates/axt-protocol-generate/**,crates/axt-conformance-adapter/**,fuzz/**
sonar.sourceEncoding=UTF-8

# Coverage: rust.yml keeps the LCOV file of each part here.
sonar.rust.lcov.reportPaths=coverage/rust.lcov
