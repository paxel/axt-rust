# osv-scanner's exceptions, read by the OSV gate (paxel/gates vulns.yml). Each one says why
# the repository is not exposed and why no update removes it, and carries a date; when the
# date passes, the gate fails again: that is the review.
#
# An advisory:
# [[IgnoredVulns]]
# id = "RUSTSEC-2026-0000"
# ignoreUntil = 2027-05-14
# reason = "..."
#
# A licence outside the standard's allowlist (one package):
# [[PackageOverrides]]
# name = "some-crate"
# ecosystem = "crates.io"
# license.ignore = true
# effectiveUntil = 2027-05-14
# reason = "..."

[[PackageOverrides]]
name = "libfuzzer-sys"
ecosystem = "crates.io"
license.ignore = true
effectiveUntil = 2027-05-23
reason = "Only the fuzz crate (fuzz/) uses it, which is never published or shipped; its licence NCSA AND (Apache-2.0 OR MIT) adds NCSA, LLVM's permissive OSI-approved licence, which the allowlist lacks."
