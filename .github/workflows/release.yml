name: Release

# A release: the gate first, then the crate files, then provenance, then the GitHub release
# with every file, and last the crates on crates.io, which keeps a version for good.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  build:
    needs: [version, gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The crates as crates.io gets them.
      - name: Build the release files
        run: |
          rustup toolchain install
          cargo package --locked -p axt-protocol -p axt-protocol-generate
          mkdir -p dist
          cp target/package/*.crate dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/

  provenance:
    needs: build
    uses: paxel/gates/.github/workflows/provenance.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: axt-protocol
      tag: ${{ github.ref_name }}
      artifacts: dist-*

  publish:
    needs: [version, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: dist/*

  # crates.io through trusted publishing (OIDC), once the GitHub release is out. The first
  # version is published by hand; trusted publishing is enabled on crates.io after it.
  crates-io:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          rustup toolchain install
          cargo publish --locked -p axt-protocol
          cargo publish --locked -p axt-protocol-generate
